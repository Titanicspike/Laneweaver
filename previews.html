<!doctype html>
<html><head><meta charset="utf-8"><title>Laneweaver road previews</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0d0f12; color:#c9cdd4; font:12px/1.4 ui-sans-serif,system-ui,sans-serif; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:8px; padding:8px; }
  figure { margin:0; background:#14161a; border:1px solid #2b3038; border-radius:6px; overflow:hidden; }
  figcaption { padding:3px 8px; font-weight:600; color:#e7eaee; display:flex; justify-content:space-between; }
  figcaption .note { font-weight:400; color:#8b929c; }
  .pair { display:grid; grid-template-columns:1fr 1fr; }
  .pair > div { position:relative; }
  .pair > div::after {
    content:attr(data-label); position:absolute; left:4px; top:2px;
    font-size:10px; color:#8b929c; text-shadow:0 0 3px #000;
  }
  canvas { display:block; width:100%; height:110px; }
</style></head>
<body><div id="grid"></div><script type="module" src="/scratch/previews.ts"></script></body></html>
